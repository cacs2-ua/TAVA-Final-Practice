services:
  shapy:
    image: shapy-cu102-ubuntu18:latest
    container_name: shapy-cpu

    working_dir: /workspace
    shm_size: "8gb"
    ipc: host

    ports:
      - "8888:8888"

    volumes:
      - ./workspace:/workspace
      - ./scripts:/workspace/scripts:ro
      - ./notebooks:/workspace/notebooks

    environment:
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: none
      FORCE_CUDA: "0"
      PYOPENGL_PLATFORM: egl
      SHAPY_DIR: /workspace/shapy
      PYTHONPATH: /workspace/shapy:/workspace/shapy/attributes
      SHAPY_DEVICE: cpu

    command: >
      bash -lc "jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=shapy
      --NotebookApp.password=''"
